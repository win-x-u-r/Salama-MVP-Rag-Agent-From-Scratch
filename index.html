<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agentic RAG</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #171a23;
      --border: #262a36;
      --text: #e6e8ee;
      --muted: #8b90a0;
      --user: #2563eb;
      --bot: #1f2430;
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 820px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; }
    header .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: #22c55e;
    }
    header .sub { color: var(--muted); font-size: 13px; margin-left: auto; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg { display: flex; gap: 10px; max-width: 85%; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .bubble {
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.5;
      font-size: 15px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg.user .bubble { background: var(--user); color: #fff; border-bottom-right-radius: 4px; }
    .msg.bot .bubble { background: var(--bot); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg.error .bubble { background: #3b1d1d; border: 1px solid #7f1d1d; color: #fecaca; }
    /* rendered markdown inside bot bubbles */
    .msg.bot .bubble { white-space: normal; }
    .bubble ul { margin: 6px 0; padding-left: 20px; }
    .bubble li { margin: 2px 0; }
    .bubble strong { font-weight: 600; }
    .bubble code {
      background: rgba(255, 255, 255, 0.08);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 0.9em;
    }
    .typing { display: inline-flex; gap: 4px; align-items: center; }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
      animation: blink 1.2s infinite both;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
    footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }
    #input {
      flex: 1;
      resize: none;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      font-family: inherit;
      max-height: 160px;
      outline: none;
    }
    #input:focus { border-color: var(--accent); }
    #send {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    #send:disabled { opacity: .5; cursor: not-allowed; }
    .empty { color: var(--muted); text-align: center; margin: auto; font-size: 14px; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <span class="dot"></span>
      <h1>Agentic RAG</h1>
      <span class="sub">GDRFA Dubai · Visa Services</span>
    </header>
    <div id="messages">
      <div class="empty" id="empty">Ask a question about Visa &amp; Visa Services.</div>
    </div>
    <footer>
      <textarea id="input" rows="1" placeholder="Type your question…  (Enter to send, Shift+Enter for newline)"></textarea>
      <button id="send">Send</button>
    </footer>
  </div>

  <script>
    const API = "/chat/stream"; // same origin as FastAPI (streaming endpoint)
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const emptyEl = document.getElementById("empty");

    // --- Minimal, self-contained markdown renderer (no external libraries) ---
    function escapeHtml(s) {
      return s
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function renderInline(s) {
      // bold first, so leftover single * can be treated as italic
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
      s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
      return s;
    }

    function renderMarkdown(md) {
      const lines = escapeHtml(md).split("\n");
      let html = "";
      let inList = false;
      for (const line of lines) {
        const bullet = line.match(/^\s*[-*]\s+(.*)$/);
        if (bullet) {
          if (!inList) { html += "<ul>"; inList = true; }
          html += "<li>" + renderInline(bullet[1]) + "</li>";
        } else {
          if (inList) { html += "</ul>"; inList = false; }
          if (line.trim() === "") {
            html += "<br>";
          } else {
            html += "<div>" + renderInline(line) + "</div>";
          }
        }
      }
      if (inList) html += "</ul>";
      return html;
    }

    // Bot text is markdown -> render to HTML; user/error text stays plain (safe).
    function setBubbleContent(bubble, text, role) {
      if (role === "bot") {
        bubble.innerHTML = renderMarkdown(text);
      } else {
        bubble.textContent = text;
      }
    }

    function addMessage(text, role) {
      if (emptyEl) emptyEl.remove();
      const msg = document.createElement("div");
      msg.className = "msg " + role;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      setBubbleContent(bubble, text, role);
      msg.appendChild(bubble);
      messagesEl.appendChild(msg);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return bubble;
    }

    function addTyping() {
      if (emptyEl) emptyEl.remove();
      const msg = document.createElement("div");
      msg.className = "msg bot";
      msg.innerHTML = '<div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>';
      messagesEl.appendChild(msg);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return msg;
    }

    async function send() {
      const question = inputEl.value.trim();
      if (!question) return;
      addMessage(question, "user");
      inputEl.value = "";
      autoGrow();
      sendBtn.disabled = true;
      const typing = addTyping();

      try {
        const res = await fetch(API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        if (!res.ok || !res.body) {
          throw new Error("HTTP " + res.status);
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let answer = "";
        let bubble = null;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value, { stream: true });
          if (!chunk) continue;
          if (!bubble) {
            typing.remove();          // remove the dots once the first token arrives
            bubble = addMessage("", "bot");
          }
          answer += chunk;
          setBubbleContent(bubble, answer, "bot");
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        if (!bubble) {
          typing.remove();
          addMessage("No answer returned.", "error");
        }
      } catch (err) {
        typing.remove();
        addMessage("Could not reach the server: " + err.message, "error");
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    function autoGrow() {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
    }

    sendBtn.addEventListener("click", send);
    inputEl.addEventListener("input", autoGrow);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
    inputEl.focus();
  </script>
</body>
</html>
